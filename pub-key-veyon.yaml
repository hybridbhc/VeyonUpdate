---
- name: Dodaj klucz publiczny Veyon
  hosts: all
  become: true

  vars:
    source_key: "/mnt/praceuczniow/SkryptyAuto/s302_public_key.pem"
    key_name: "sp3/public"
    temp_key: "/tmp/s302_public_key.pem"
    veyon_cli: "/usr/bin/veyon-cli"

  tasks:
    - name: Sprawdź, czy klucz jest dostępny
      ansible.builtin.stat:
        path: "{{ source_key }}"
      register: key_file

    - name: Przerwij, jeśli nie znaleziono klucza
      ansible.builtin.fail:
        msg: "Nie znaleziono klucza: {{ source_key }}. Sprawdź, czy udział SMB jest zamontowany."
      when: not key_file.stat.exists

    - name: Skopiuj klucz tymczasowo na host docelowy
      ansible.builtin.copy:
        src: "{{ source_key }}"
        dest: "{{ temp_key }}"
        mode: "0600"

    - name: Zaimportuj klucz publiczny do Veyon
      ansible.builtin.command:
        argv:
          - "{{ veyon_cli }}"
          - authkeys
          - import
          - "{{ key_name }}"
          - "{{ temp_key }}"
      register: import_result
      changed_when: import_result.rc == 0

    - name: Usuń plik tymczasowy
      ansible.builtin.file:
        path: "{{ temp_key }}"
        state: absent
